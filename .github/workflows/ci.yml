name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 2"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Exercise GNU ld's archive ordering, including the Linux ARM64 release case.
      - name: Build with GNU ld
        run: cargo rustc --locked -- -C link-arg=-fuse-ld=bfd
      - run: cargo test --locked --all-targets

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0543 (chrono is unmaintained) is informational: no
          # patched release exists and no vulnerability is reported. This
          # plugin does not use chrono itself; it is required by the Arrow
          # crates that duckdb depends on (`cargo tree -i chrono`), so there
          # is no way to drop it short of replacing duckdb. Re-check whenever
          # duckdb or Arrow is upgraded, or if the advisory gains a patched
          # version.
          ignore: RUSTSEC-2026-0543
